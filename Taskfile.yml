# Task runner for sms_forwarder. https://taskfile.dev
# Run `task` (or `task --list`) to see available tasks.
version: '3'

vars:
  APK_DIR: build/app/outputs/flutter-apk

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  setup:
    desc: One-time dev setup — packages + git hooks
    cmds:
      - flutter pub get
      - lefthook install

  fix:
    desc: Auto-fix lints and format Dart sources (makes the pre-commit hook pass)
    cmds:
      - dart fix --apply
      - dart format .

  test:
    desc: Run unit tests
    cmds:
      - flutter test

  build:
    desc: 'Build APK — release w/ datetime version by default; pass `-- --debug` for a debug APK'
    vars:
      NAME:
        sh: date +%Y.%m.%d.%H%M
      CODE:
        sh: date +%s
    cmds:
      - >-
        {{if contains "--debug" .CLI_ARGS}}flutter build apk --debug{{else}}flutter build apk
        --split-per-abi --release --build-name={{.NAME}} --build-number={{.CODE}}{{end}}

  install:
    desc: 'Install a release APK. Vars: DEVICE=<id> ABI=<armeabi-v7a|arm64-v8a|x86_64>'
    vars:
      ABI: '{{.ABI | default "arm64-v8a"}}'
    cmds:
      - flutter install {{if .DEVICE}}--device-id {{.DEVICE}} {{end}}--use-application-binary={{.APK_DIR}}/app-{{.ABI}}-release.apk
